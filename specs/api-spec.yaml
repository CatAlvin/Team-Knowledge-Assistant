  "components": {
    "schemas": {
      "Alert": {
        "properties": {
          "message_id": {
            "type": "string",
            "title": "Message Id"
          },
          "severity": {
            "type": "string",
            "enum": [
              "high",
              "medium"
            ],
            "title": "Severity"
          },
          "channel": {
            "type": "string",
            "title": "Channel"
          },
          "matched": {
            "items": {
              "type": "string"
            },
            "type": "array",
            "title": "Matched"
          },
          "text": {
            "type": "string",
            "title": "Text"
          }
        },
        "type": "object",
        "required": [
          "message_id",
          "severity",
          "channel",
          "matched",
          "text"
        ],
        "title": "Alert"
      },
      "Alerts": {
        "properties": {
          "alerts": {
            "items": {
              "$ref": "#/components/schemas/Alert"
            },
            "type": "array",
            "title": "Alerts"
          }
        },
        "type": "object",
        "required": [
          "alerts"
        ],
        "title": "Alerts"
      },
      "Answer": {
        "properties": {
          "question": {
            "type": "string",
            "title": "Question"
          },
          "answer": {
            "type": "string",
            "title": "Answer"
          },
          "sources": {
            "items": {
              "type": "string"
            },
            "type": "array",
            "title": "Sources"
          },
          "top_score": {
            "type": "number",
            "maximum": 1.0,
            "minimum": 0.0,
            "title": "Top Score"
          },
          "refused": {
            "type": "boolean",
            "title": "Refused"
          },
          "mode": {
            "type": "string",
            "title": "Mode"
          }
        },
        "type": "object",
        "required": [
          "question",
          "answer",
          "sources",
          "top_score",
          "refused",
          "mode"
        ],
        "title": "Answer"
      },
      "Ask": {
        "properties": {
          "question": {
            "type": "string",
            "maxLength": 2000,
            "minLength": 3,
            "title": "Question"
          }
        },
        "type": "object",
        "required": [
          "question"
        ],
        "title": "Ask"
      },
      "AskRequest": {
        "properties": {
          "question": {
            "type": "string",
            "maxLength": 2000,
            "minLength": 3,
            "title": "Question"
          },
          "k": {
            "type": "integer",
            "maximum": 5.0,
            "minimum": 1.0,
            "title": "K",
            "default": 2
          }
        },
        "type": "object",
        "required": [
          "question"
        ],
        "title": "AskRequest"
      },
      "Brief": {
        "properties": {
          "days": {
            "type": "integer",
            "maximum": 90.0,
            "minimum": 1.0,
            "title": "Days",
            "default": 7
          }
        },
        "type": "object",
        "title": "Brief"
      },
      "Digest": {
        "properties": {
          "message_count": {
            "type": "integer",
            "minimum": 0.0,
            "title": "Message Count"
          },
          "alerts": {
            "items": {
              "$ref": "#/components/schemas/Alert"
            },
            "type": "array",
            "title": "Alerts"
          },
          "summaries": {
            "additionalProperties": {
              "type": "string"
            },
            "type": "object",
            "title": "Summaries"
          },
          "tasks": {
            "items": {
              "$ref": "#/components/schemas/Task"
            },
            "type": "array",
            "title": "Tasks"
          },
          "faq": {
            "items": {
              "$ref": "#/components/schemas/Answer"
            },
            "type": "array",
            "title": "Faq"
          },
          "mode": {
            "type": "string",
            "title": "Mode"
          }
        },
        "type": "object",
        "required": [
          "message_count",
          "alerts",
          "summaries",
          "tasks",
          "faq",
          "mode"
        ],
        "title": "Digest"
      },
      "DigestRequest": {
        "properties": {
          "faq_queries": {
            "items": {
              "type": "string",
              "maxLength": 2000,
              "minLength": 3
            },
            "type": "array",
            "maxItems": 10,
            "title": "Faq Queries"
          }
        },
        "type": "object",
        "title": "DigestRequest"
      },
      "HTTPValidationError": {
        "properties": {
          "detail": {
            "items": {
              "$ref": "#/components/schemas/ValidationError"
            },
            "type": "array",
            "title": "Detail"
          }
        },
        "type": "object",
        "title": "HTTPValidationError"
      },
      "Health": {
        "properties": {
          "status": {
            "type": "string",
            "const": "ok",
            "title": "Status",
            "default": "ok"
          },
          "version": {
            "type": "string",
            "title": "Version"
          }
        },
        "type": "object",
        "required": [
          "version"
        ],
        "title": "Health"
      },
      "Ready": {
        "properties": {
          "status": {
            "type": "string",
            "const": "ready",
            "title": "Status",
            "default": "ready"
          },
          "messages": {
            "type": "integer",
            "title": "Messages"
          },
          "kb_chunks": {
            "type": "integer",
            "title": "Kb Chunks"
          }
        },
        "type": "object",
        "required": [
          "messages",
          "kb_chunks"
        ],
        "title": "Ready"
      },
      "SummarizeRequest": {
        "properties": {
          "channel": {
            "type": "string",
            "maxLength": 100,
            "minLength": 1,
            "title": "Channel",
            "default": "#incidents"
          }
        },
        "type": "object",
        "title": "SummarizeRequest"
      },
      "Summary": {
        "properties": {
          "channel": {
            "type": "string",
            "title": "Channel"
          },
          "summary": {
            "type": "string",
            "title": "Summary"
          },
          "mode": {
            "type": "string",
            "title": "Mode"
          }
        },
        "type": "object",
        "required": [
          "channel",
          "summary",
          "mode"
        ],
        "title": "Summary"
      },
      "Task": {
        "properties": {
          "task": {
            "type": "string",
            "minLength": 1,
            "title": "Task"
          },
          "owner": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Owner"
          },
          "due": {
            "anyOf": [
              {
                "type": "string",
                "format": "date"
              },
              {
                "type": "null"
              }
            ],
            "title": "Due"
          },
          "priority": {
            "type": "string",
            "enum": [
              "high",
              "medium",
              "low"
            ],
            "title": "Priority"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "task",
          "priority"
        ],
        "title": "Task"
      },
      "Tasks": {
        "properties": {
          "tasks": {
            "items": {
              "$ref": "#/components/schemas/Task"
            },
            "type": "array",
            "title": "Tasks"
          }
        },
        "type": "object",
        "required": [
          "tasks"
        ],
        "title": "Tasks"
      },
      "ValidationError": {
        "properties": {
          "loc": {
            "items": {
              "anyOf": [
                {
                  "type": "string"
                },
                {
                  "type": "integer"
                }
              ]
            },
            "type": "array",
            "title": "Location"
          },
          "msg": {
            "type": "string",
            "title": "Message"
          },
          "type": {
            "type": "string",
            "title": "Error Type"
          },
          "input": {
            "title": "Input"
          },
          "ctx": {
            "type": "object",
            "title": "Context"
          }
        },
        "type": "object",
        "required": [
          "loc",
          "msg",
          "type"
        ],
        "title": "ValidationError"
      }
    }
  },
  "x-mcp": {
    "transports": [
      "stdio"
    ],
    "tools": [
      {
        "name": "scan_risks",
        "description": "Return graded risk alerts from the message snapshot.",
        "inputSchema": {
          "properties": {},
          "title": "scan_risksArguments",
          "type": "object"
        },
        "outputSchema": {
          "properties": {
            "result": {
              "items": {
                "additionalProperties": true,
                "type": "object"
              },
              "title": "Result",
              "type": "array"
            }
          },
          "required": [
            "result"
          ],
          "title": "scan_risksOutput",
          "type": "object"
        },
        "annotations": {
          "readOnlyHint": true,
          "openWorldHint": false
        }
      },
      {
        "name": "summarize_channel",
        "description": "Summarize one channel.",
        "inputSchema": {
          "properties": {
            "channel": {
              "default": "#incidents",
              "title": "Channel",
              "type": "string"
            }
          },
          "title": "summarize_channelArguments",
          "type": "object"
        },
        "annotations": {
          "readOnlyHint": true,
          "openWorldHint": false
        }
      },
      {
        "name": "extract_action_items",
        "description": "Return validated tasks, owners, due dates and priorities.",
        "inputSchema": {
          "properties": {},
          "title": "extract_action_itemsArguments",
          "type": "object"
        },
        "outputSchema": {
          "properties": {
            "result": {
              "items": {
                "additionalProperties": true,
                "type": "object"
              },
              "title": "Result",
              "type": "array"
            }
          },
          "required": [
            "result"
          ],
          "title": "extract_action_itemsOutput",
          "type": "object"
        },
        "annotations": {
          "readOnlyHint": true,
          "openWorldHint": false
        }
      },
      {
        "name": "ask_kb",
        "description": "Answer from local documents with source references or refuse.",
        "inputSchema": {
          "properties": {
            "question": {
              "title": "Question",
              "type": "string"
            },
            "k": {
              "default": 2,
              "title": "K",
              "type": "integer"
            }
          },
          "required": [
            "question"
          ],
          "title": "ask_kbArguments",
          "type": "object"
        },
        "annotations": {
          "readOnlyHint": true,
          "openWorldHint": false
        }
      }
    ]
  },
  "x-authentication": {
    "environment": "SERVICE_API_KEY",
    "header": "Authorization: Bearer <token>",
    "public_paths": [
      "/healthz",
      "/",
      "/assets/*"
    ],
    "when_unset": "local access without authentication"
  }
}
